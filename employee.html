
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .form-box {
            max-width: 400px;
            margin: 0 auto 30px;
            padding: 25px;
            background: white;
            border: 1px solid #333;
            border-radius: 15px;
        }

        h2, h3 {
            text-align: center;
            color: #183153;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #1769aa;
            color: white;
        }

        #addBtn {
            display: block;
            margin: 20px auto 0;
        }

        .table-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #1769aa;
            color: white;
        }

        .delete-btn {
            background: #d93025;
        }

        #message {
            text-align: center;
            color: #176b35;
        }
    </style>
</head>

<body>
<div class="container">

    <div class="form-box">
        <h2>Employee Form</h2>

        <form id="employeeForm">
            <label for="empId">Employee ID</label>
            <input type="number" id="empId" required>

            <label for="empName">Employee Name</label>
            <input type="text" id="empName" required>

            <label for="empRole">Role</label>
            <select id="empRole" required>
                <option value="">Select Role</option>
                <option value="Manager">Manager</option>
                <option value="Developer">Developer</option>
                <option value="Designer">Designer</option>
                <option value="HR">HR</option>
                <option value="Intern">Intern</option>
            </select>

            <label for="empSalary">Salary (₹)</label>
            <input type="number" id="empSalary" min="0"
                   step="0.01" required>

            <button type="submit" id="addBtn">Add Employee</button>
        </form>

        <p id="message" role="status"></p>
    </div>

    <div class="table-box">
        <h3>Employee Details</h3>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Salary (₹)</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="employeeTable">
                <!-- Employee rows appear here -->
            </tbody>
        </table>
    </div>

</div>

<script>
    const form = document.getElementById("employeeForm");
    const table = document.getElementById("employeeTable");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const id = document.getElementById("empId").value.trim();
        const name = document.getElementById("empName").value.trim();
        const role = document.getElementById("empRole").value;
        const salary = document.getElementById("empSalary").value;

        if (!id || !name || !role || salary === "") {
            message.textContent = "Please fill all fields.";
            return;
        }

        // Prevent duplicate employee IDs
        const rows = table.querySelectorAll("tr");

        for (const row of rows) {
            if (row.cells[0].textContent === id) {
                message.textContent = "Employee ID already exists!";
                return;
            }
        }

        // Create a new table row using DOM
        const row = document.createElement("tr");

        [id, name, role, Number(salary).toFixed(2)].forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
        });

        // Create Delete button
        const actionCell = document.createElement("td");
        const deleteBtn = document.createElement("button");

        deleteBtn.textContent = "Delete";
        deleteBtn.className = "delete-btn";

        deleteBtn.addEventListener("click", function() {
            row.remove();
            message.textContent = "Employee deleted.";
        });

        actionCell.appendChild(deleteBtn);
        row.appendChild(actionCell);

        // Add employee to table
        table.appendChild(row);

        message.textContent = "Employee added successfully!";
        form.reset();
    });
</script>

</body>
</html>
